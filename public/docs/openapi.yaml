                        description: 'Thương hiệu chiếu sáng hàng đầu nước Đức với hơn 115 năm kinh nghiệm, chuyên cung cấp đèn LED, đèn chiếu sáng chuyên dụng, automotive và hệ thống điều khiển ánh sáng thông minh.'
