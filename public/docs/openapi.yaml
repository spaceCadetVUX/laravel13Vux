openapi: 3.0.3
info:
  title: 'YourShop API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/site/config:
    get:
      summary: 'GET /api/v1/site/config'
      operationId: gETapiv1siteconfig
      description: "Returns business profile data and global JSON-LD schemas.\nNuxt layout calls this once (SSR, cached) to render Organization/WebSite\nschemas and populate footer contact info."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: OK
                  data:
                    name: 'Laravel Shop'
                    legal_name: null
                    tagline: null
                    email: null
                    phone: null
                    address:
                      line: null
                      city: null
                      state: null
                      country: null
                      postal_code: null
                      latitude: null
                      longitude: null
                    business_hours: null
                    social_links: null
                    currency: VND
                    logo_path: null
                    jsonld_schemas:
                      -
                        '@context': 'https://schema.org'
                        '@type': Organization
                        '@id': 'http://127.0.0.1:8000/#organization'
                        name: 'Laravel Shop'
                        url: 'http://127.0.0.1:8000'
                      -
                        '@context': 'https://schema.org'
                        '@type': WebSite
                        '@id': 'http://127.0.0.1:8000/#website'
                        name: 'Laravel Shop'
                        url: 'http://127.0.0.1:8000'
                        potentialAction:
                          '@type': SearchAction
                          target:
                            '@type': EntryPoint
                            urlTemplate: 'http://127.0.0.1:8000/search?q={search_term_string}'
                          query-input: 'required name=search_term_string'
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: 'Laravel Shop'
                      legal_name:
                        type: string
                        example: null
                        nullable: true
                      tagline:
                        type: string
                        example: null
                        nullable: true
                      email:
                        type: string
                        example: null
                        nullable: true
                      phone:
                        type: string
                        example: null
                        nullable: true
                      address:
                        type: object
                        properties:
                          line:
                            type: string
                            example: null
                            nullable: true
                          city:
                            type: string
                            example: null
                            nullable: true
                          state:
                            type: string
                            example: null
                            nullable: true
                          country:
                            type: string
                            example: null
                            nullable: true
                          postal_code:
                            type: string
                            example: null
                            nullable: true
                          latitude:
                            type: string
                            example: null
                            nullable: true
                          longitude:
                            type: string
                            example: null
                            nullable: true
                      business_hours:
                        type: string
                        example: null
                        nullable: true
                      social_links:
                        type: string
                        example: null
                        nullable: true
                      currency:
                        type: string
                        example: VND
                      logo_path:
                        type: string
                        example: null
                        nullable: true
                      jsonld_schemas:
                        type: array
                        example:
                          -
                            '@context': 'https://schema.org'
                            '@type': Organization
                            '@id': 'http://127.0.0.1:8000/#organization'
                            name: 'Laravel Shop'
                            url: 'http://127.0.0.1:8000'
                          -
                            '@context': 'https://schema.org'
                            '@type': WebSite
                            '@id': 'http://127.0.0.1:8000/#website'
                            name: 'Laravel Shop'
                            url: 'http://127.0.0.1:8000'
                            potentialAction:
                              '@type': SearchAction
                              target:
                                '@type': EntryPoint
                                urlTemplate: 'http://127.0.0.1:8000/search?q={search_term_string}'
                              query-input: 'required name=search_term_string'
                        items:
                          type: object
                          properties:
                            '@context':
                              type: string
                              example: 'https://schema.org'
                            '@type':
                              type: string
                              example: Organization
                            '@id':
                              type: string
                              example: 'http://127.0.0.1:8000/#organization'
                            name:
                              type: string
                              example: 'Laravel Shop'
                            url:
                              type: string
                              example: 'http://127.0.0.1:8000'
      tags:
        - Endpoints
  /api/v1/ping:
    get:
      summary: ''
      operationId: getApiV1Ping
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                properties:
                  status:
                    type: string
                    example: ok
      tags:
        - Endpoints
  /api/v1/auth/register:
    post:
      summary: "POST /api/v1/auth/register\nRegister a new customer account."
      operationId: pOSTapiv1authregisterRegisterANewCustomerAccount
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: validation.max.
                  example: b
                email:
                  type: string
                  description: 'validation.email validation.max.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: validation.min.
                  example: '-0pBNvYgxw'
              required:
                - name
                - email
                - password
  /api/v1/auth/login:
    post:
      summary: "POST /api/v1/auth/login\nLogin with email + password."
      operationId: pOSTapiv1authloginLoginWithEmail+Password
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
  /api/v1/auth/google:
    post:
      summary: 'POST /api/v1/auth/google'
      operationId: pOSTapiv1authgoogle
      description: "Authenticate via Google ID token (sent from the Nuxt frontend after\nthe user completes the Google consent flow on the client side)."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: ''
                  example: architecto
              required:
                - id_token
  /api/v1/auth/forgot-password:
    post:
      summary: 'POST /api/v1/auth/forgot-password'
      operationId: pOSTapiv1authforgotPassword
      description: "Always returns 200 regardless of whether the email exists — prevents\nuser enumeration."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: gbailey@example.net
              required:
                - email
  /api/v1/auth/reset-password:
    post:
      summary: 'POST /api/v1/auth/reset-password'
      operationId: pOSTapiv1authresetPassword
      description: "Validates the token and updates the user's password.\nRevokes all existing Sanctum tokens on success."
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: validation.email.
                  example: gbailey@example.net
                token:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: validation.min.
                  example: ']|{+-0pBNvYg'
                password_confirmation:
                  type: string
                  description: ''
                  example: architecto
              required:
                - email
                - token
                - password
                - password_confirmation
  '/api/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'GET /api/v1/auth/email/verify/{id}/{hash}  [signed]'
      operationId: gETapiv1authemailverifyidhashsigned
      description: "Validates the signed URL, checks the hash, and marks the email as verified.\nThe `signed` middleware aborts with 403 before this runs if the URL is\ninvalid or expired."
      parameters: []
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/auth/logout:
    post:
      summary: "POST /api/v1/auth/logout  [auth:sanctum]\nRevoke current access token."
      operationId: pOSTapiv1authlogoutauthsanctumRevokeCurrentAccessToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
  /api/v1/auth/me:
    get:
      summary: "GET /api/v1/auth/me  [auth:sanctum]\nReturn the authenticated user's profile."
      operationId: gETapiv1authmeauthsanctumReturnTheAuthenticatedUsersProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    put:
      summary: "PUT /api/v1/auth/me  [auth:sanctum]\nUpdate the authenticated user's name and/or phone."
      operationId: pUTapiv1authmeauthsanctumUpdateTheAuthenticatedUsersNameAndorPhone
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: validation.max.
                  example: b
                phone:
                  type: string
                  description: validation.max.
                  example: ngzmiyvdljnikhwa
                  nullable: true
  /api/v1/auth/email/resend:
    post:
      summary: 'POST /api/v1/auth/email/resend  [auth:sanctum]'
      operationId: pOSTapiv1authemailresendauthsanctum
      description: 'Re-sends the verification email for the authenticated user.'
      parameters: []
      responses: {  }
      tags:
        - Endpoints
  /api/v1/categories:
    get:
      summary: "GET /api/v1/categories\nReturn the full active category tree (root categories + nested children)."
      operationId: gETapiv1categoriesReturnTheFullActiveCategoryTreerootCategories+NestedChildren
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
  '/api/v1/categories/{slug}':
    get:
      summary: "GET /api/v1/categories/{slug}\nReturn a single category with its paginated active products."
      operationId: gETapiv1categoriesslugReturnASingleCategoryWithItsPaginatedActiveProducts
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Category not found.'
                properties:
                  message:
                    type: string
                    example: 'Category not found.'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the category.'
        example: '2'
        required: true
        schema:
          type: string
  /api/v1/brands:
    get:
      summary: "GET /api/v1/brands\nReturn all active brands ordered by sort_order."
      operationId: gETapiv1brandsReturnAllActiveBrandsOrderedBySortOrder
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: success
                  message: OK
                  data:
                    -
                      id: '2'
                      name: Philips
                      slug: philips
                      logo_url: null
                      description: 'Thương hiệu chiếu sáng hàng đầu thế giới, tiên phong trong công nghệ LED và giải pháp ánh sáng thông minh cho nhà ở, văn phòng và công trình.'
                      website: 'https://www.signify.com'
                      sort_order: 1
                      products_count: 0
                    -
                      id: '3'
                      name: 'Schneider Electric'
                      slug: schneider-electric
                      logo_url: null
                      description: 'Tập đoàn quản lý năng lượng và tự động hóa hàng đầu thế giới, cung cấp các giải pháp ổ cắm, thiết bị điện, tủ điện và hệ thống quản lý toà nhà.'
                      website: 'https://www.se.com'
                      sort_order: 2
                      products_count: 0
                    -
                      id: '4'
                      name: Panasonic
                      slug: panasonic
                      logo_url: null
                      description: 'Tập đoàn điện tử Nhật Bản nổi tiếng với các dòng đèn LED, ổ cắm, công tắc và thiết bị điện dân dụng chất lượng cao, bền bỉ và tiết kiệm điện.'
                      website: 'https://www.panasonic.com'
                      sort_order: 3
                      products_count: 0
                    -
                      id: '5'
                      name: 'Rạng Đông'
                      slug: rang-dong
                      logo_url: null
                      description: 'Thương hiệu chiếu sáng uy tín hàng đầu Việt Nam, chuyên sản xuất bóng đèn LED, đèn huỳnh quang và các thiết bị chiếu sáng cho gia đình và công nghiệp.'
                      website: 'https://rangdong.com.vn'
                      sort_order: 4
                      products_count: 0
                    -
                      id: '6'
                      name: Legrand
