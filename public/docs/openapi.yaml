  '/api/v1/brands/{slug}':
    get:
      summary: "GET /api/v1/brands/{slug}\nReturn a single brand with SEO, JSON-LD, and its paginated active products."
      operationId: gETapiv1brandsslugReturnASingleBrandWithSEOJSONLDAndItsPaginatedActiveProducts
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Brand not found.'
                properties:
                  message:
                    type: string
                    example: 'Brand not found.'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the brand.'
        example: '2'
        required: true
        schema:
          type: string
  /api/v1/products:
    get:
      summary: 'List products'
      operationId: listProducts
      description: 'Returns a paginated list of active products with optional filters.'
      parameters:
        -
          in: query
          name: page
          description: 'Page number. Default: 1.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number. Default: 1.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Items per page. Default: 15. Max: 100.'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Items per page. Default: 15. Max: 100.'
            example: 15
        -
          in: query
          name: category
          description: 'Filter by category slug.'
          example: smartphones
          required: false
          schema:
            type: string
            description: 'Filter by category slug.'
            example: smartphones
        -
          in: query
          name: sort
          description: 'Sort order: price_asc, price_desc, name_asc, name_desc, newest.'
          example: newest
          required: false
          schema:
            type: string
            description: 'Sort order: price_asc, price_desc, name_asc, name_desc, newest.'
            example: newest
        -
          in: query
          name: min_price
          description: 'Minimum price filter.'
          example: 100000.0
          required: false
          schema:
            type: number
            description: 'Minimum price filter.'
            example: 100000.0
        -
          in: query
          name: max_price
          description: 'Maximum price filter.'
          example: 5000000.0
          required: false
          schema:
            type: number
            description: 'Maximum price filter.'
            example: 5000000.0
        -
          in: query
          name: in_stock
          description: 'Set to 1 to return only in-stock products.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Set to 1 to return only in-stock products.'
            example: 1
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      slug: iphone-15
                      name: 'iPhone 15'
                      price: 22990000
                  meta:
                    current_page: 1
                    total: 50
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        slug: iphone-15
                        name: 'iPhone 15'
                        price: 22990000
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          example: iphone-15
                        name:
                          type: string
                          example: 'iPhone 15'
                        price:
                          type: integer
                          example: 22990000
                  meta:
                    type: object
                    properties:
