                        logo_url: null
                        description: 'Tập đoàn Pháp chuyên thiết bị hạ tầng điện và kỹ thuật số, nổi tiếng với dòng ổ cắm Céliane, Mosaic và hệ thống quản lý tòa nhà BTicino.'
                        website: 'https://www.legrand.com'
