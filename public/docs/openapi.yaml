                      website: 'https://www.osram.com'
                      sort_order: 6
                      products_count: 0
                    -
                      id: '8'
                      name: 'Điện Quang'
                      slug: dien-quang
                      logo_url: null
                      description: 'Công ty cổ phần Bóng đèn Điện Quang — thương hiệu chiếu sáng Việt Nam lâu đời với các sản phẩm LED, compact và đèn công nghiệp phân phối toàn quốc.'
                      website: 'https://www.dienquang.com.vn'
                      sort_order: 7
                      products_count: 0
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: OK
                  data:
                    type: array
                    example:
                      -
                        id: '2'
                        name: Philips
                        slug: philips
                        logo_url: null
                        description: 'Thương hiệu chiếu sáng hàng đầu thế giới, tiên phong trong công nghệ LED và giải pháp ánh sáng thông minh cho nhà ở, văn phòng và công trình.'
                        website: 'https://www.signify.com'
                        sort_order: 1
                        products_count: 0
                      -
                        id: '3'
                        name: 'Schneider Electric'
                        slug: schneider-electric
                        logo_url: null
                        description: 'Tập đoàn quản lý năng lượng và tự động hóa hàng đầu thế giới, cung cấp các giải pháp ổ cắm, thiết bị điện, tủ điện và hệ thống quản lý toà nhà.'
                        website: 'https://www.se.com'
                        sort_order: 2
                        products_count: 0
                      -
                        id: '4'
                        name: Panasonic
                        slug: panasonic
                        logo_url: null
                        description: 'Tập đoàn điện tử Nhật Bản nổi tiếng với các dòng đèn LED, ổ cắm, công tắc và thiết bị điện dân dụng chất lượng cao, bền bỉ và tiết kiệm điện.'
                        website: 'https://www.panasonic.com'
                        sort_order: 3
